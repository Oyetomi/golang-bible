apiVersion: v1
kind: Service
metadata:
  name: ledger
spec:
  selector:
    app: ledger          # matches BOTH the stable and the canary pods
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-stable
spec:
  replicas: 10
  selector:
    matchLabels: {app: ledger, track: stable}
  template:
    metadata:
      labels: {app: ledger, track: stable}
      annotations: {prometheus.io/scrape: "true"}
    spec:
      containers:
        - name: ledger
          image: ledger-api:v1
          command: ["/ledger-api"]
          env:
            - {name: VERSION, value: v1}
            - {name: BUG_RATE, value: "0"}
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 1
          lifecycle:
            preStop:
              sleep: {seconds: 3}   # keep serving while kube-proxy stops routing here
          resources:
            requests: {cpu: 20m, memory: 32Mi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-canary
spec:
  replicas: 0
  selector:
    matchLabels: {app: ledger, track: canary}
  template:
    metadata:
      labels: {app: ledger, track: canary}
      annotations: {prometheus.io/scrape: "true"}
    spec:
      containers:
        - name: ledger
          image: ledger-api:v1
          command: ["/ledger-api"]
          env:
            - {name: VERSION, value: v2}
            - {name: BUG_RATE, value: "0.05"}   # the regression we are about to ship
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 1
          lifecycle:
            preStop:
              sleep: {seconds: 3}   # keep serving while kube-proxy stops routing here
          resources:
            requests: {cpu: 20m, memory: 32Mi}
