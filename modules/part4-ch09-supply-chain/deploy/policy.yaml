apiVersion: v1
kind: Namespace
metadata:
  name: prod
  labels:
    verify-images: enabled      # the webhook only applies to namespaces with this label
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-policy
spec:
  replicas: 1
  selector:
    matchLabels: {app: image-policy}
  template:
    metadata:
      labels: {app: image-policy}
    spec:
      containers:
        - name: webhook
          image: localhost:5001/webhook:1.0
          args: ["-registry-rewrite=localhost:5001=registry:5000"]
          ports: [{containerPort: 8443}]
          volumeMounts:
            - {name: tls, mountPath: /etc/tls, readOnly: true}
            - {name: key, mountPath: /etc/policy, readOnly: true}
      volumes:
        - name: tls
          secret: {secretName: image-policy-tls}
        - name: key
          configMap: {name: image-policy-key}
---
apiVersion: v1
kind: Service
metadata:
  name: image-policy
spec:
  selector: {app: image-policy}
  ports: [{port: 443, targetPort: 8443}]
