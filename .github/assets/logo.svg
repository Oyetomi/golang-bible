<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12151e" />
      <stop offset="100%" stop-color="#07080c" />
    </linearGradient>

    <!-- Electric Go Cyan Gradient -->
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="40%" stop-color="#00ADD8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Inner Bezel Stroke -->
    <linearGradient id="bezel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.16)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.04)" />
      <stop offset="100%" stop-color="rgba(0, 173, 216, 0.12)" />
    </linearGradient>

    <!-- Subtle Cyan Drop Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00ADD8" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="128" height="128" rx="28" fill="url(#bg)" />
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="url(#bezel)" stroke-width="1.2" />

  <!-- Iconic Minimalist Monogram: Geometric 'G' & Lightning Speed Notch -->
  <g filter="url(#glow)">
    <!-- Main Outer Arc of G -->
    <path
      d="M 88 44
         C 80 32, 66 26, 49 26
         C 28 26, 17 42, 17 64
         C 17 86, 28 102, 49 102
         C 68 102, 82 94, 88 80
         C 90 75, 90 71, 90 66
         L 52 66
         C 49 66, 47 68, 47 71
         C 47 74, 49 76, 52 76
         L 78 76
         C 76 83, 67 90, 50 90
         C 35 90, 28 78, 28 64
         C 28 50, 35 38, 50 38
         C 62 38, 71 44, 76 51
         C 78 54, 82 54, 84 52
         L 88 44 Z"
      fill="url(#cyan)"
    />

    <!-- Illuminated Gold Spark / Crown Mark (Top Right) -->
    <polygon
      points="99,28 103,37 112,41 103,45 99,54 95,45 86,41 95,37"
      fill="url(#gold)"
    />

    <!-- Speed Dash Under G -->
    <rect x="62" y="83" width="24" height="4" rx="2" fill="url(#gold)" opacity="0.9" />
  </g>
</svg>
