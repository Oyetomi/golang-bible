<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 88" width="344" height="88" role="img" aria-label="The Go Bible">
  <title>The Go Bible</title>
  <defs>
    <linearGradient id="gbLogo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#29C9F2"/>
      <stop offset="1" stop-color="#0090B6"/>
    </linearGradient>
  </defs>

  <!-- The wordmark is near-white, so the lockup carries its own ground and
       stays legible on a light README as well as the dark app shell. -->
  <rect width="344" height="88" rx="18" fill="#0B0B0F"/>
  <rect x="0.6" y="0.6" width="342.8" height="86.8" rx="17.4" fill="none" stroke="#29C9F2" stroke-opacity="0.22"/>

  <g transform="translate(14 12)">
    <rect width="64" height="64" rx="15" fill="url(#gbLogo)"/>
    <g fill="#0B1220">
      <circle cx="17" cy="17.5" r="7"/>
      <circle cx="47" cy="17.5" r="7"/>
      <path d="M10 31 C10 13.5, 54 13.5, 54 31 L54 39 C54 51.5, 10 51.5, 10 39 Z"/>
    </g>
    <circle cx="23" cy="29.5" r="10.4" fill="#FFFFFF"/>
    <circle cx="41" cy="29.5" r="10.4" fill="#FFFFFF"/>
    <circle cx="25" cy="29.5" r="5.2" fill="#0B1220"/>
    <circle cx="43" cy="29.5" r="5.2" fill="#0B1220"/>
    <rect x="29.4" y="43.4" width="2.4" height="5.4" rx="1.1" fill="#FFFFFF"/>
    <rect x="32.2" y="43.4" width="2.4" height="5.4" rx="1.1" fill="#FFFFFF"/>
  </g>

  <text x="94" y="47" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="700" letter-spacing="-0.8" fill="#F4F4F5">The Go <tspan fill="#29C9F2">Bible</tspan></text>
  <text x="95" y="66" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10.5" letter-spacing="1.6" fill="#8B8B94">120 CHAPTERS · GO 1.26</text>
</svg>
