name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Validate Content & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck TypeScript
        run: pnpm typecheck

      - name: Validate manifest and chapters
        run: pnpm validate

      - name: Lint MDX syntax
        run: pnpm lint-mdx

      - name: Build search index and Next.js static pages
        run: pnpm build

  snippets:
    name: Compile Go Snippets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # Hermetic: stdlib-only snippets, no module proxy, so a proxy outage
      # cannot turn the book red. Blocking.
      - name: Build stdlib snippets
        run: node scripts/test-snippets.mjs --strict

  snippets-modules:
    name: Compile Go Snippets (third-party)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      # Reaches the module proxy, so it reports but never blocks a merge.
      - name: Build snippets that import third-party modules
        run: node scripts/test-snippets.mjs --report-only --with-modules
