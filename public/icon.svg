<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bg-canvas" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="100%" stop-color="#080a10" />
    </linearGradient>

    <!-- Renée French Classic Go Cyan Body Gradient -->
    <linearGradient id="gopher-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#70d6ff" />
      <stop offset="45%" stop-color="#00ADD8" />
      <stop offset="100%" stop-color="#008cb0" />
    </linearGradient>

    <!-- Snout & Belly Cream Gradient -->
    <linearGradient id="snout-cream" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0ede6" />
    </linearGradient>

    <!-- Ear Inner Warm Gradient -->
    <linearGradient id="ear-inner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Gold Accent for Bible Foundation -->
    <linearGradient id="bible-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="60%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Hairline Border Stroke -->
    <linearGradient id="border-stroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.16)" />
      <stop offset="50%" stop-color="rgba(0, 173, 216, 0.25)" />
      <stop offset="100%" stop-color="rgba(0, 0, 0, 0.4)" />
    </linearGradient>

    <!-- Drop Shadow for 3D Depth -->
    <filter id="soft-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00ADD8" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- Squircle Obsidian Card Base -->
  <rect width="128" height="128" rx="28" fill="url(#bg-canvas)" />
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="url(#border-stroke)" stroke-width="1.2" />

  <!-- The Authentic Renée French Go Gopher -->
  <g filter="url(#soft-shadow)">
    <!-- Ears -->
    <circle cx="34" cy="28" r="10.5" fill="url(#gopher-blue)" />
    <circle cx="34" cy="28" r="5.5" fill="url(#ear-inner)" opacity="0.85" />

    <circle cx="94" cy="28" r="10.5" fill="url(#gopher-blue)" />
    <circle cx="94" cy="28" r="5.5" fill="url(#ear-inner)" opacity="0.85" />

    <!-- Chubby Gopher Body / Head Capsule -->
    <path
      d="M 34 38
         C 34 22, 94 22, 94 38
         L 98 84
         C 98 104, 30 104, 30 84
         Z"
      fill="url(#gopher-blue)"
    />

    <!-- Little Paws / Feet Base -->
    <ellipse cx="44" cy="103" rx="10" ry="5.5" fill="url(#gopher-blue)" stroke="#008cb0" stroke-width="0.8" />
    <ellipse cx="84" cy="103" rx="10" ry="5.5" fill="url(#gopher-blue)" stroke="#008cb0" stroke-width="0.8" />

    <!-- Giant Renée French Gopher Eyes (White Sclera) -->
    <!-- Left Eye -->
    <ellipse cx="47" cy="44" rx="14" ry="14.5" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.6" />
    <!-- Right Eye -->
    <ellipse cx="81" cy="44" rx="14" ry="14.5" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.6" />

    <!-- Big Round Pupils Looking Up & Friendly -->
    <!-- Left Pupil -->
    <circle cx="49" cy="43.5" r="7" fill="#1e293b" />
    <circle cx="51.5" cy="41" r="2.4" fill="#ffffff" />
    <circle cx="47" cy="46" r="1.1" fill="#ffffff" />

    <!-- Right Pupil -->
    <circle cx="79" cy="43.5" r="7" fill="#1e293b" />
    <circle cx="81.5" cy="41" r="2.4" fill="#ffffff" />
    <circle cx="77" cy="46" r="1.1" fill="#ffffff" />

    <!-- Two Iconic Buck Teeth (Behind Muzzle) -->
    <rect x="57" y="67" width="6.5" height="11" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />
    <rect x="64.5" y="67" width="6.5" height="11" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />

    <!-- Chubby Cream Muzzle / Snout -->
    <!-- Left Cheek Bulb -->
    <circle cx="56" cy="62" r="10.5" fill="url(#snout-cream)" />
    <!-- Right Cheek Bulb -->
    <circle cx="72" cy="62" r="10.5" fill="url(#snout-cream)" />
    <!-- Bridge Joining Cheeks -->
    <ellipse cx="64" cy="63" rx="8" ry="7" fill="url(#snout-cream)" />

    <!-- Cute Dark Button Nose -->
    <ellipse cx="64" cy="56" rx="5.5" ry="4" fill="#0f172a" />
    <!-- Nose Highlight -->
    <ellipse cx="62.5" cy="54.8" rx="2" ry="1.2" fill="#ffffff" opacity="0.7" />

    <!-- Tiny Front Paws Holding Foundation / Open Book -->
    <!-- Left Paw -->
    <circle cx="41" cy="80" r="5.5" fill="url(#gopher-blue)" stroke="#008cb0" stroke-width="0.8" />
    <!-- Right Paw -->
    <circle cx="87" cy="80" r="5.5" fill="url(#gopher-blue)" stroke="#008cb0" stroke-width="0.8" />

    <!-- Golden Open Bible / Codex Ribbon Motif -->
    <g transform="translate(64, 88)">
      <path d="M 0 0 C -9 -3, -20 -4, -30 2 L -30 9 C -20 4, -9 4, 0 7 Z" fill="url(#bible-gold)" />
      <path d="M 0 0 C 9 -3, 20 -4, 30 2 L 30 9 C 20 4, 9 4, 0 7 Z" fill="url(#bible-gold)" />
      <path d="M 0 -1 L 0 9" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
      <polygon points="0,9 -2.5,14 0,12.5 2.5,14" fill="url(#bible-gold)" />
    </g>
  </g>
</svg>
