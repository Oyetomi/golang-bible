<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 88" width="360" height="88" role="img" aria-label="The Go Bible">
  <title>The Go Bible</title>
  <defs>
    <linearGradient id="gbBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B3A6B"/>
      <stop offset="1" stop-color="#0B1B38"/>
    </linearGradient>
    <linearGradient id="gbFur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FDDF2"/>
      <stop offset="1" stop-color="#2FB5D8"/>
    </linearGradient>
    <linearGradient id="gbPage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFBF2"/>
      <stop offset="1" stop-color="#F1E3C6"/>
    </linearGradient>
  </defs>
  <!-- The lockup carries its own warm-paper ground so it reads on light and dark READMEs. -->
  <rect width="360" height="88" rx="18" fill="#FBF7EF"/>
  <rect x="0.6" y="0.6" width="358.8" height="86.8" rx="17.4" fill="none" stroke="#1B3A6B" stroke-opacity="0.14"/>
  <g transform="translate(12 12)">
    <rect width="64" height="64" rx="15" fill="url(#gbBg)"/>
  
  <!-- soft glow behind the head -->
  <circle cx="32" cy="27" r="22" fill="#2FB5D8" opacity=".16"/>
  <!-- ears -->
  <circle cx="18.5" cy="13.5" r="4.6" fill="url(#gbFur)"/>
  <circle cx="45.5" cy="13.5" r="4.6" fill="url(#gbFur)"/>
  <circle cx="18.5" cy="13.5" r="2" fill="#1C8FB0"/>
  <circle cx="45.5" cy="13.5" r="2" fill="#1C8FB0"/>
  <!-- head, peeking over the book -->
  <path d="M13 42 C13 20, 17 11, 32 11 C47 11, 51 20, 51 42 Z" fill="url(#gbFur)"/>
  <!-- eyes -->
  <circle cx="24.5" cy="24.5" r="7" fill="#FFFFFF"/>
  <circle cx="39.5" cy="24.5" r="7" fill="#FFFFFF"/>
  <circle cx="26" cy="25.5" r="3.4" fill="#0B1B38"/>
  <circle cx="41" cy="25.5" r="3.4" fill="#0B1B38"/>
  <circle cx="27.1" cy="24.2" r="1.1" fill="#FFFFFF"/>
  <circle cx="42.1" cy="24.2" r="1.1" fill="#FFFFFF"/>
  <!-- muzzle and teeth -->
  <ellipse cx="32" cy="33.2" rx="5.2" ry="3.6" fill="#F3D9B0"/>
  <ellipse cx="32" cy="31.6" rx="2.1" ry="1.5" fill="#0B1B38"/>
  <rect x="30.1" y="35.6" width="1.7" height="2.6" rx=".6" fill="#FFFFFF"/>
  <rect x="32.2" y="35.6" width="1.7" height="2.6" rx=".6" fill="#FFFFFF"/>
  <!-- the open book -->
  <path d="M6 40.5 C14 37.5, 24 37.5, 32 41 C40 37.5, 50 37.5, 58 40.5 L58 55 C50 52, 40 52, 32 55.5 C24 52, 14 52, 6 55 Z" fill="url(#gbPage)"/>
  <path d="M32 41 L32 55.5" stroke="#C99A4A" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M11 44.5 C17 43, 22 43, 27 44.6 M11 48.5 C17 47, 22 47, 27 48.6 M37 44.6 C42 43, 47 43, 53 44.5 M37 48.6 C42 47, 47 47, 53 48.5" stroke="#D9C39A" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- paws on the page edge -->
  <ellipse cx="21" cy="40.6" rx="3.6" ry="2.4" fill="url(#gbFur)"/>
  <ellipse cx="43" cy="40.6" rx="3.6" ry="2.4" fill="url(#gbFur)"/>
  </g>
  <text x="94" y="48" font-family="Newsreader, 'Iowan Old Style', Georgia, 'Times New Roman', serif"
        font-size="33" font-weight="600" letter-spacing="-0.6" fill="#13213D">The Go <tspan fill="#0B83A8" font-style="italic">Bible</tspan></text>
  <text x="95" y="67" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="10.5" letter-spacing="1.6" fill="#6B6557">121 CHAPTERS · GO 1.27</text>
</svg>
