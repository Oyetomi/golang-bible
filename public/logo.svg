<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#060911" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>

    <!-- Cyan Accent Glow -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ADD8" />
      <stop offset="100%" stop-color="#007d9c" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Border Stroke Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ADD8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00ADD8" stop-opacity="0.2" />
    </linearGradient>

    <!-- Radial Core Glow -->
    <radialGradient id="core-glow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#00ADD8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#00ADD8" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="128" height="128" rx="28" fill="url(#bg-grad)" />
  <rect width="128" height="128" rx="28" fill="url(#core-glow)" />
  <rect x="1.5" y="1.5" width="125" height="125" rx="26.5" fill="none" stroke="url(#border-grad)" stroke-width="1.5" />

  <!-- Gopher Silhouette & Bible Book Motif -->
  <!-- Left & Right Ears -->
  <circle cx="42" cy="38" r="8" fill="url(#cyan-glow)" />
  <circle cx="42" cy="38" r="4.5" fill="#0b0f19" opacity="0.6" />
  <circle cx="86" cy="38" r="8" fill="url(#cyan-glow)" />
  <circle cx="86" cy="38" r="4.5" fill="#0b0f19" opacity="0.6" />

  <!-- Gopher Head / Body -->
  <rect x="36" y="34" width="56" height="52" rx="26" fill="url(#cyan-glow)" />

  <!-- Goggles Frame / Bridge -->
  <rect x="38" y="44" width="52" height="24" rx="12" fill="#060911" stroke="#00ADD8" stroke-width="2" />
  <rect x="58" y="52" width="12" height="4" fill="#00ADD8" />

  <!-- Glowing Lenses (Eyes) -->
  <circle cx="50" cy="56" r="8.5" fill="#ffffff" />
  <circle cx="52" cy="56" r="4.5" fill="#060911" />
  <circle cx="54" cy="54" r="1.8" fill="#38BDF8" />

  <circle cx="78" cy="56" r="8.5" fill="#ffffff" />
  <circle cx="80" cy="56" r="4.5" fill="#060911" />
  <circle cx="82" cy="54" r="1.8" fill="#38BDF8" />

  <!-- Snout & Teeth -->
  <ellipse cx="64" cy="69" rx="8" ry="5.5" fill="#ffffff" />
  <ellipse cx="64" cy="67" rx="3.5" ry="2.2" fill="#0b0f19" />
  <!-- Two Front Gopher Teeth -->
  <rect x="61.5" y="72" width="2.2" height="4" rx="0.8" fill="#ffffff" stroke="#0b0f19" stroke-width="0.6" />
  <rect x="64.3" y="72" width="2.2" height="4" rx="0.8" fill="#ffffff" stroke="#0b0f19" stroke-width="0.6" />

  <!-- Illuminated Open Book / Foundation Base -->
  <g transform="translate(64, 95)">
    <!-- Open Book Pages Left & Right -->
    <path d="M 0 0 C -12 -4, -28 -5, -42 2 L -42 12 C -28 6, -12 6, 0 10 Z" fill="url(#gold-grad)" />
    <path d="M 0 0 C 12 -4, 28 -5, 42 2 L 42 12 C 28 6, 12 6, 0 10 Z" fill="url(#gold-grad)" />
    <!-- Book Spine Rib / Center Ribbon -->
    <path d="M 0 -2 L 0 14" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
    <polygon points="0,14 -3,20 0,18 3,20" fill="url(#gold-grad)" />
  </g>
</svg>
