<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <!-- Obsidian Base Canvas -->
  <rect width="128" height="128" rx="28" fill="#09090b" />
  <rect x="1" y="1" width="126" height="126" rx="27" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1.2" />

  <!-- Authentic Renée French Go Gopher (Flat, Non-AI, Iconic) -->
  <g>
    <!-- Ears -->
    <circle cx="35" cy="35" r="11" fill="#00ADD8" />
    <circle cx="35" cy="35" r="5.5" fill="#F472B6" />

    <circle cx="93" cy="35" r="11" fill="#00ADD8" />
    <circle cx="93" cy="35" r="5.5" fill="#F472B6" />

    <!-- Gopher Head / Body Capsule -->
    <path d="M 32 52 C 32 30, 96 30, 96 52 L 96 88 C 96 106, 32 106, 32 88 Z" fill="#00ADD8" />

    <!-- Two Iconic Buck Teeth (drawn before muzzle so they sit behind) -->
    <rect x="58.5" y="76" width="5" height="9" rx="1.5" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />
    <rect x="64.5" y="76" width="5" height="9" rx="1.5" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />

    <!-- Big Curious Eyes (White Sclera) -->
    <circle cx="49" cy="52" r="14" fill="#ffffff" />
    <circle cx="79" cy="52" r="14" fill="#ffffff" />

    <!-- Dark Round Pupils (Looking slightly up & forward) -->
    <circle cx="51.5" cy="50.5" r="7" fill="#0f172a" />
    <circle cx="53.8" cy="48.2" r="2.4" fill="#ffffff" />

    <circle cx="81.5" cy="50.5" r="7" fill="#0f172a" />
    <circle cx="83.8" cy="48.2" r="2.4" fill="#ffffff" />

    <!-- Chubby Cream Muzzle -->
    <circle cx="57" cy="71" r="9.5" fill="#fff8ee" />
    <circle cx="71" cy="71" r="9.5" fill="#fff8ee" />
    <ellipse cx="64" cy="71" rx="7" ry="6" fill="#fff8ee" />

    <!-- Dark Button Nose -->
    <ellipse cx="64" cy="63.5" rx="5.5" ry="4.2" fill="#0f172a" />
    <ellipse cx="62.5" cy="62.5" rx="1.8" ry="1.2" fill="#ffffff" opacity="0.6" />

    <!-- Cute Front Paws -->
    <ellipse cx="46" cy="98" rx="8.5" ry="5" fill="#008cb0" />
    <ellipse cx="82" cy="98" rx="8.5" ry="5" fill="#008cb0" />
  </g>
</svg>
